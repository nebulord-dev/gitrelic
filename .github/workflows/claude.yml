name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request:
    # Not `synchronize`: a full review on every push cost ~$45 over 61 runs in
    # two days. A PR is reviewed once when opened; comment `@claude` for more.
    types: [opened]

# Grouped by event type as well as number, so a PR's review never cancels an
# in-flight reply to an @claude comment, and comment replies themselves are
# never cancelled.
concurrency:
  group: claude-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  claude:
    runs-on: ubuntu-latest
    # A comment runs only when it mentions @claude and comes from someone with
    # repo access. (A comment event carries `issue` or `pull_request` too, so
    # testing those fields let any comment by anyone through.)
    if: |
      github.actor != 'claude[bot]' &&
      github.actor != 'github-advanced-security[bot]' && (
        github.event_name == 'issues' ||
        github.event_name == 'pull_request' || (
          contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        )
      )
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          # The maintainer's Claude subscription (`claude setup-token`), not a
          # pay-per-token API key: runs count against its usage limits.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: false
          # Read-only `gh pr diff` / `gh pr view` let it read the PR it reviews;
          # without them a review run hit two permission denials and posted
          # nothing (#133).
          claude_args: --model claude-sonnet-5-5 --allowedTools "Bash(gh issue comment:*),Bash(gh pr comment:*),Bash(gh issue list:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            You are a helpful code reviewer and issue triager for the GitRelic repo.

            GitHub event: ${{ github.event_name }}
            Issue/PR number: ${{ github.event.issue.number || github.event.pull_request.number }}
            Actor: ${{ github.actor }}

            Comment body (if applicable): ${{ github.event.comment.body }}
            Issue title (if applicable): ${{ github.event.issue.title }}
            Issue body (if applicable): ${{ github.event.issue.body }}

            If this is a new issue (event: issues):
            - Determine if it's a bug report, feature request, or question
            - Assess priority (critical, high, medium, low)
            - Check for duplicates using `gh issue list`
            - Post an analysis comment using `gh issue comment ${{ github.event.issue.number }} --body "..."`

            If this is a new or updated PR (event: pull_request):
            - Read the change with `gh pr diff ${{ github.event.pull_request.number }}` (and `gh pr view` for its description)
            - Review for correctness, potential bugs, and security issues
            - Post feedback using `gh pr comment`

            If this is an @claude mention (event: issue_comment):
            - Read the comment body above and respond helpfully
            - Post your response using `gh issue comment ${{ github.event.issue.number }} --body "..."`
